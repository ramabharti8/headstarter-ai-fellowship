name: Doc Q&A CI

# Reference copy. GitHub runs workflows only from the repository ROOT
# `.github/workflows/`; the activated copy lives at
# `<repo-root>/.github/workflows/docqa-ci.yml`.
on:
  push:
    paths: ["05-document-qa-api/**"]
  pull_request:
    paths: ["05-document-qa-api/**"]

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 05-document-qa-api
    env:
      QA_FAKE_AI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: pytest
