<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Document Q&amp;A</title>
<style>
  :root { color-scheme: light dark; --bg:#0f172a; --card:#1e293b; --fg:#e2e8f0; --accent:#38bdf8; --muted:#94a3b8; }
  @media (prefers-color-scheme: light) { :root { --bg:#f1f5f9; --card:#fff; --fg:#0f172a; --accent:#0284c7; --muted:#64748b; } }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.55 system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:760px; margin:0 auto; padding:32px 20px 64px; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 28px; }
  .card { background:var(--card); border-radius:12px; padding:20px; margin-bottom:20px; box-shadow:0 1px 3px rgba(0,0,0,.15); }
  label { font-weight:600; display:block; margin-bottom:8px; }
  input[type=file], input[type=text], textarea { width:100%; padding:10px; border-radius:8px; border:1px solid var(--muted); background:transparent; color:var(--fg); font:inherit; }
  textarea { min-height:70px; resize:vertical; }
  button { margin-top:12px; background:var(--accent); color:#04222f; border:0; border-radius:8px; padding:10px 18px; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.5; cursor:progress; }
  .out { white-space:pre-wrap; background:rgba(127,127,127,.12); border-radius:8px; padding:14px; margin-top:12px; font-size:14px; }
  .src { font-size:13px; color:var(--muted); border-left:2px solid var(--accent); padding-left:10px; margin-top:8px; }
  .pill { display:inline-block; font-size:12px; background:rgba(127,127,127,.15); border-radius:999px; padding:2px 10px; margin-left:8px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Document Q&amp;A <span class="pill" id="status">checking…</span></h1>
  <p class="sub">Upload a PDF, then ask questions. Answers cite the pages they came from.</p>

  <div class="card">
    <label for="file">1 · Upload a PDF</label>
    <input type="file" id="file" accept="application/pdf" />
    <button id="uploadBtn">Upload</button>
    <div class="out" id="uploadOut" hidden></div>
  </div>

  <div class="card">
    <label for="q">2 · Ask a question</label>
    <input type="text" id="docId" placeholder="doc_id (filled in after upload)" />
    <textarea id="q" placeholder="What are the key findings?"></textarea>
    <button id="askBtn">Ask</button>
    <div class="out" id="askOut" hidden></div>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const api = (p, opts) => fetch(p, opts).then(async r => {
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || r.statusText);
  return body;
});

api("/health").then(h => {
  $("status").textContent = h.fake_ai ? "demo mode (fake-ai)" : h.provider;
}).catch(() => $("status").textContent = "offline");

$("uploadBtn").onclick = async () => {
  const f = $("file").files[0];
  if (!f) return alert("Choose a PDF first.");
  const btn = $("uploadBtn"); btn.disabled = true;
  const out = $("uploadOut"); out.hidden = false; out.textContent = "Uploading & indexing…";
  try {
    const fd = new FormData(); fd.append("file", f);
    const r = await api("/upload", { method: "POST", body: fd });
    $("docId").value = r.doc_id;
    out.textContent = `Indexed "${r.filename}" — ${r.pages} pages, ${r.chunks} chunks.\ndoc_id: ${r.doc_id}`;
  } catch (e) { out.textContent = "Error: " + e.message; }
  finally { btn.disabled = false; }
};

$("askBtn").onclick = async () => {
  const doc_id = $("docId").value.trim(), question = $("q").value.trim();
  if (!doc_id || question.length < 3) return alert("Need a doc_id and a question.");
  const btn = $("askBtn"); btn.disabled = true;
  const out = $("askOut"); out.hidden = false; out.textContent = "Thinking…";
  try {
    const r = await api("/ask", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ doc_id, question }),
    });
    out.innerHTML = "";
    const a = document.createElement("div"); a.textContent = r.answer; out.appendChild(a);
    r.sources.forEach(s => {
      const d = document.createElement("div"); d.className = "src";
      d.textContent = `p.${s.page ?? "?"} — ${s.snippet}`; out.appendChild(d);
    });
  } catch (e) { out.textContent = "Error: " + e.message; }
  finally { btn.disabled = false; }
};
</script>
</body>
</html>
