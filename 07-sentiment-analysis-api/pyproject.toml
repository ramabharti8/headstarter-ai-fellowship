[project]
name = "sentiment-analysis-api"
version = "1.0.0"
description = "Real-time sentiment scoring for text and social media (Hugging Face + FastAPI)."
requires-python = ">=3.11"

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.ruff.lint.per-file-ignores]
"app/analyzer.py" = ["E501"]  # lexicon literals read better on one line

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
