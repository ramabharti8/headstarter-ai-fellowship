name: Sentiment API CI

# GitHub runs workflows only from the repository root `.github/workflows/`.
# Path filter + working-directory scope this to 07-sentiment-analysis-api.
on:
  push:
    paths: ["07-sentiment-analysis-api/**", ".github/workflows/sentiment-ci.yml"]
  pull_request:
    paths: ["07-sentiment-analysis-api/**", ".github/workflows/sentiment-ci.yml"]

concurrency:
  group: sentiment-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 07-sentiment-analysis-api
    env:
      SENT_FAKE_MODEL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-ci.txt
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: pytest

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: 07-sentiment-analysis-api
          push: false
          tags: sentiment-analysis-api:ci
