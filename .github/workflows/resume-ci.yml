name: Resume Screener CI

# GitHub runs workflows only from the repository root `.github/workflows/`.
# Path filter + working-directory scope this to 08-ai-resume-screener.
on:
  push:
    paths: ["08-ai-resume-screener/**", ".github/workflows/resume-ci.yml"]
  pull_request:
    paths: ["08-ai-resume-screener/**", ".github/workflows/resume-ci.yml"]

concurrency:
  group: resume-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 08-ai-resume-screener
    env:
      RS_FAKE_AI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: pytest

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: 08-ai-resume-screener
          push: false
          tags: ai-resume-screener:ci
