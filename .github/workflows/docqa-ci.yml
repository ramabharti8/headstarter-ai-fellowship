name: Doc Q&A CI

# GitHub runs workflows only from the repository root `.github/workflows/`.
# Path filter + working-directory scope this to 05-document-qa-api.
on:
  push:
    paths: ["05-document-qa-api/**", ".github/workflows/docqa-ci.yml"]
  pull_request:
    paths: ["05-document-qa-api/**", ".github/workflows/docqa-ci.yml"]

concurrency:
  group: docqa-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 05-document-qa-api
    env:
      QA_FAKE_AI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: pytest

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: 05-document-qa-api
          push: false
          tags: document-qa-api:ci
