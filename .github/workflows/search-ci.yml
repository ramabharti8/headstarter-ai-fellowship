name: Smart Search API CI

# GitHub runs workflows only from the repository root `.github/workflows/`.
# Path filter + working-directory scope this to 09-smart-search-api.
on:
  push:
    paths: ["09-smart-search-api/**", ".github/workflows/search-ci.yml"]
  pull_request:
    paths: ["09-smart-search-api/**", ".github/workflows/search-ci.yml"]

concurrency:
  group: search-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 09-smart-search-api
    env:
      SS_FAKE_EMBED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: pytest

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: 09-smart-search-api
          push: false
          tags: smart-search-api:ci
