name: Email Drafting Tool CI

# GitHub runs workflows only from the repository root `.github/workflows/`.
# Path filter + working-directory scope this to 10-ai-email-drafting-tool.
on:
  push:
    paths: ["10-ai-email-drafting-tool/**", ".github/workflows/email-ci.yml"]
  pull_request:
    paths: ["10-ai-email-drafting-tool/**", ".github/workflows/email-ci.yml"]

concurrency:
  group: email-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 10-ai-email-drafting-tool
    env:
      EM_FAKE_AI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: pytest

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: 10-ai-email-drafting-tool
          push: false
          tags: ai-email-drafting-tool:ci
