<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Smart Search API</title>
  <meta name="description" content="Index documents and search them by meaning, not just keywords — semantic search with a live similarity score." />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="7" fill="var(--accent)"/>
          <circle cx="14" cy="14" r="6.5" fill="none" stroke="#fff" stroke-width="2.2"/>
          <path d="M19 19l5 5" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
        <strong>Smart Search API</strong>
      </div>
      <div class="topbar__spacer"></div>
      <span class="pill" id="statusPill">…</span>
      <button class="icon-link" id="themeToggle" type="button" aria-label="Toggle light / dark theme" title="Toggle theme"></button>
    </header>

    <main class="grid">
      <section class="panel panel--index">
        <div class="tabs" role="tablist">
          <button class="tab is-active" id="tabSearch" role="tab" type="button">Search</button>
          <button class="tab" id="tabIndex" role="tab" type="button">Index documents</button>
        </div>

        <div id="searchPane">
          <div class="field">
            <span class="field__label">Query</span>
            <input type="text" id="query" placeholder="e.g. Python backend framework" />
          </div>
          <div class="field field--inline">
            <label>
              <span class="field__label">Top K</span>
              <input type="number" id="topK" value="5" min="1" max="50" />
            </label>
          </div>
          <div class="actions">
            <button class="btn btn--ghost" id="seedBtn" type="button">Index sample docs</button>
            <button class="btn btn--primary" id="searchBtn" type="button">Search</button>
          </div>
        </div>

        <div id="indexPane" hidden>
          <div class="field field--grow">
            <span class="field__label">Documents <span class="field__opt">(one per line)</span></span>
            <textarea id="docs" spellcheck="false" placeholder="FastAPI is a modern Python web framework&#10;React is a JavaScript UI library&#10;PostgreSQL is a relational database"></textarea>
          </div>
          <div class="actions">
            <button class="btn btn--primary" id="indexBtn" type="button">Index documents</button>
          </div>
        </div>

        <div class="section browse">
          <h2>Indexed documents <span class="count" id="totalCount">0</span>
            <button class="link-btn" id="refreshBtn" type="button">refresh</button>
          </h2>
          <ul class="doc-list" id="docList"></ul>
        </div>
      </section>

      <section class="panel panel--output" id="output">
        <div class="empty" id="emptyState">
          <div class="empty__glyph">
            <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="20" cy="20" r="12" fill="none" stroke="currentColor" stroke-width="2.6"/><path d="M29 29l9 9" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/></svg>
          </div>
          <h1>Search results appear here</h1>
          <p>Index a few documents on the left (or hit <strong>Index sample docs</strong>), then search by meaning — results rank by semantic similarity, even without shared keywords.</p>
        </div>

        <div class="results" id="results" hidden>
          <p class="meta" id="resultMeta"></p>
          <ul class="result-list" id="resultList"></ul>
        </div>

        <div class="loading" id="loading" hidden>
          <div class="spinner"></div>
          <p id="loadingText">Working…</p>
        </div>
      </section>
    </main>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="/assets/app.js" defer></script>
</body>
</html>
